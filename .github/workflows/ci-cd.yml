name: CI/CD - Calculadora Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-pruebas:
    name: Ejecutar Pruebas Automaticas
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar calculadora.py
        run: python calculadora.py

      - name: Ejecutar pruebas con pytest
        run: python -m pytest test_calculadora.py -v

      - name: Confirmar resultado
        run: echo "CI/CD completado exitosamente. Todas las pruebas pasaron."